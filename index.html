<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Office Games Expense Tracker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
      :root {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        color-scheme: light;
        color: #1e293b;
        background: #f8fafc;
        --primary: #3b82f6;
        --primary-dark: #1d4ed8;
        --primary-light: #60a5fa;
        --success: #059669;
        --warning: #d97706;
        --danger: #dc2626;
        --dark: #1e293b;
        --light: #f8fafc;
        --border: #e2e8f0;
        --text-secondary: #64748b;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
      }

      * {
        box-sizing: border-box;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      .container {
        max-width: 1140px;
        margin: 28px auto;
        padding: 0 20px 32px;
      }

      h1,
      h2,
      p,
      label,
      button {
        margin: 0;
      }

      .hero-card {
        margin-bottom: 20px;
        padding: 28px;
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 24px 80px rgba(15, 23, 42, 0.08);
        backdrop-filter: blur(18px);
      }

      .eyebrow {
        color: var(--primary);
        font-size: 0.85rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        font-weight: 700;
        margin-bottom: 10px;
      }

      .hero-card h1 {
        font-size: clamp(2rem, 3vw, 2.8rem);
        line-height: 1.05;
        margin-bottom: 14px;
      }

      .hero-copy {
        max-width: 720px;
        color: #4b5563;
        line-height: 1.75;
      }

      .metrics-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;
        margin-top: 24px;
      }

      .metric-card {
        padding: 20px 22px;
        border-radius: 16px;
        background: linear-gradient(135deg, #ffffff 0%, #f9fafb 100%);
        border: 1px solid var(--border);
        transition: all 0.3s ease;
      }

      .metric-card:hover {
        transform: translateY(-6px);
        box-shadow: 0 20px 40px rgba(59, 130, 246, 0.12);
        border-color: var(--primary-light);
      }

      .metric-label {
        display: block;
        color: #64748b;
        margin-bottom: 10px;
        font-size: 0.9rem;
        font-weight: 600;
      }

      .metric-card strong {
        font-size: 1.6rem;
        color: var(--primary);
        display: block;
        margin-bottom: 8px;
      }

      .metric-card small {
        color: #94a3b8;
        font-size: 0.85rem;
      }

      .card {
        background: linear-gradient(135deg, #ffffff 0%, #f9fbff 100%);
        border-radius: 20px;
        padding: 28px;
        margin-bottom: 20px;
        box-shadow: 0 10px 30px rgba(14, 165, 233, 0.08);
        border: 1px solid var(--border);
        transition: all 0.3s ease;
      }

      .card:hover {
        box-shadow: 0 15px 50px rgba(14, 165, 233, 0.12);
      }

      .card h2 {
        font-size: 1.4rem;
        margin-bottom: 20px;
        color: var(--dark);
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .subtitle {
        color: #475569;
        margin-top: 6px;
        margin-bottom: 24px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }

      .form-grid {
        gap: 18px;
      }

      label {
        display: block;
        color: #334155;
        font-weight: 600;
        font-size: 0.95rem;
      }

      input,
      select,
      textarea {
        width: 100%;
        border-radius: 16px;
        border: 1px solid #cbd5e1;
        padding: 14px 16px;
        margin-top: 8px;
        background: #f8fafc;
        color: #0f172a;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      input:focus,
      select:focus,
      textarea:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.12);
      }

      select[multiple] {
        min-height: 160px;
      }

      .actions {
        margin-top: 20px;
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
      }

      button {
        border: none;
        border-radius: 12px;
        padding: 12px 16px;
        color: white;
        background: var(--primary);
        cursor: pointer;
        transition: all 0.3s ease;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      button:hover {
        transform: translateY(-2px);
        background: var(--primary-dark);
        box-shadow: 0 12px 24px rgba(59, 130, 246, 0.2);
      }

      button:active {
        transform: translateY(0);
      }

      .section-icon {
        width: 28px;
        height: 28px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 10px;
        margin-right: 10px;
        font-size: 1.2rem;
        color: white;
      }

      .icon-trends {
        background: linear-gradient(135deg, #3b82f6, #60a5fa);
      }

      .icon-players {
        background: linear-gradient(135deg, #7c3aed, #a855f7);
      }

      .icon-calendar {
        background: linear-gradient(135deg, #d946ef, #ec4899);
      }

      .icon-add {
        background: linear-gradient(135deg, #059669, #10b981);
      }

      .icon-activity {
        background: linear-gradient(135deg, #d97706, #f59e0b);
      }

      .icon-balance {
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
      }

      .icon-settlement {
        background: linear-gradient(135deg, #0891b2, #14b8a6);
      }

      .icon-balance {
        background: linear-gradient(135deg, #6366f1, #a855f7);
      }

      .icon-settlement {
        background: linear-gradient(135deg, #14b8a6, #10b981);
      }

      button.outline {

        color: var(--primary);
        border: 2px solid var(--primary);

      button.outline:hover {
        background: rgba(59, 130, 246, 0.08);
      }

      button.danger {
        background: var(--danger);
      }

      button.danger:hover {
        background: #dc2626;
      }

      .message {
        margin-top: 18px;
        color: #0f172a;
        font-weight: 600;
      }

      .responsive-table {
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 680px;

      th,
      td {

        padding: 16px 14px;

        border-bottom: 2px solid var(--primary);

      tbody tr {

      tbody td {

      .pos {

      }

      .neg {

        flex-wrap: wrap;

      .preview-chip {

        color: var(--primary-dark);

        font-size: 0.9rem;

      .preview-chip.secondary {

        color: #475569;
        border-color: var(--border);
      }

      .multi-select-field {
        position: relative;
      }

      .multi-select {
        position: relative;
      }

      .multi-select-trigger {
        width: 100%;
        border-radius: 16px;
        border: 1px solid #cbd5e1;
        background: #f8fafc;
        color: #0f172a;

        gap: 16px;

        margin-bottom: 12px;
      }

      .balance-summary {

        font-size: 0.95rem;
      }

        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .settlement-list li {
        padding: 16px 18px;

        color: var(--success);

        align-items: center;

        font-weight: 600;
        color: #0284c7;

        padding: 8px 14px;

        font-weight: 700;

      .settlement-arrow {
        color: var(--text-secondary);

      .admin-panel {
        display: none;
      }

      .admin-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
        margin-bottom: 20px;
      }

      .admin-form {
        display: grid;
        grid-template-columns: 1.7fr 0.8fr;
        gap: 16px;
        align-items: end;
      }

      .admin-controls {
        display: grid;
        gap: 20px;
      }

      .admin-row {
        display: grid;
        grid-template-columns: 1.9fr 1fr;
        gap: 16px;
        align-items: end;
      }

      .player-list {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .player-chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        border-radius: 999px;
        border: 1px solid #cbd5e1;
        background: #ffffff;
        color: #0f172a;
        cursor: pointer;
        transition: background-color 0.2s ease, transform 0.2s ease;
      }

      .player-chip:hover {
        background: #eff6ff;
        transform: translateY(-1px);
      }

      .player-chip span {
        color: #ef4444;
        font-size: 0.9rem;
      }

      .empty-state {
        color: #64748b;
        padding: 20px 0;
      }

      .fade-in {
        animation: fadeInUp 0.7s ease both;
      }

      .delay-1 {
        animation-delay: 0.08s;
      }

      .delay-2 {
        animation-delay: 0.16s;
      }

      .delay-3 {
        animation-delay: 0.24s;
      }

      .delay-4 {
        animation-delay: 0.32s;
      }

      .delay-5 {
        animation-delay: 0.4s;
      }

      .pulse {
        animation: pulseCard 6s ease-in-out infinite alternate;
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(22px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes pulseCard {
        from {
          transform: translateY(0);
        }
        to {
          transform: translateY(-4px);
        }
      }

      .calendar-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 8px;
        margin-bottom: 20px;
      }

      .calendar-day {
        aspect-ratio: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        border-radius: 12px;
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        cursor: pointer;
        transition: all 0.2s ease;
        font-size: 0.85rem;
        padding: 4px;
      }

      .calendar-day:hover {
        background: #eff6ff;
        border-color: #2563eb;
      }

      .calendar-day.has-session {
        background: linear-gradient(135deg, #dbeafe 0%, #eff6ff 100%);
        border-color: #2563eb;
        font-weight: 700;
        color: #1e40af;
      }

      .calendar-day-number {
        font-weight: 600;
        font-size: 0.9rem;
      }

      .calendar-day-count {
        font-size: 0.7rem;
        color: #64748b;
      }

      .calendar-day.has-session .calendar-day-count {
        color: #1e40af;
      }

      .calendar-day-tooltip {

        bottom: 100%;
        left: 50%;

        background: white;
        border: 1px solid #cbd5e1;
        border-radius: 12px;
        padding: 12px 14px;
        box-shadow: 0 20px 40px rgba(15, 23, 42, 0.15);
        z-index: 20;
        min-width: 220px;
        font-size: 0.85rem;

      .calendar-day-tooltip::after {

      .tooltip-session {

      .tooltip-session:last-child {

      .tooltip-payer {

      .tooltip-players {

      .tooltip-cost {
        color: #2563eb;
        font-weight: 600;
        font-size: 0.8rem;
      }

      .calendar-day {
        position: relative;

      .calendar-header {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 8px;
        margin-bottom: 12px;
      }

      .calendar-header-day {

        color: #475569;

      .calendar-nav {
        display: flex;
        justify-content: space-between;
        align-items: center;

        gap: 16px;

      .calendar-month-year {
        font-size: 1.1rem;
        font-weight: 700;
        color: #0f172a;
        text-align: center;

      }

      .calendar-nav button {

      .trend-chart {

      }

      }

      .trend-bar {

      .trend-bar-fill {

      }

      .trend-bar-label {

      }

      .trend-bar-value {

      .player-stats-grid {

        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));

      .player-stat-card {

        border-radius: 16px;

      .dashboard-section {

        padding: 28px;

  <body>
    <div id="root"></div>
    <script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/react@18/umd/react.development.min.js"></script>
    <script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.development.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.23.4/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script type="text/babel">
      const { useEffect, useMemo, useRef, useState } = React;
      const { createRoot } = ReactDOM;

      const RATE_PER_HOUR = 200;
      const STORAGE_KEY = "office-games-expense-tracker-v2";

      const normalizeName = (value) => value.trim().replace(/\s+/g, " ");

      const computeBalances = (members, sessions) => {
        const balances = Object.fromEntries(members.map((name) => [name, 0]));

        sessions.forEach((s) => {
          const total = s.hours * RATE_PER_HOUR;
          const split = total / s.players.length;

          balances[s.payer] = (balances[s.payer] || 0) + total;
          s.players.forEach((p) => {
            balances[p] = (balances[p] || 0) - split;
          });
        });

        return balances;
      };

      const suggestedSettlements = (balances) => {
        const eps = 0.01;
        const creditors = Object.entries(balances)
          .filter(([, amount]) => amount > eps)
          .sort((a, b) => b[1] - a[1]);

        const debtors = Object.entries(balances)
          .filter(([, amount]) => amount < -eps)
          .map(([name, amount]) => [name, -amount])
          .sort((a, b) => b[1] - a[1]);

        const moves = [];
        let i = 0;
        let j = 0;

        while (i < debtors.length && j < creditors.length) {
          const [debtor, debt] = debtors[i];
          const [creditor, credit] = creditors[j];
          const payment = Math.min(debt, credit);

          moves.push(`${debtor} pays ${creditor}: ₹${payment.toFixed(2)}`);

          debtors[i][1] -= payment;
          creditors[j][1] -= payment;

          if (debtors[i][1] <= eps) i += 1;
          if (creditors[j][1] <= eps) j += 1;
        }

        return moves;
      };

      function App() {
        const [team, setTeam] = useState([]);
        const [sessions, setSessions] = useState([]);
        const [playersConfig, setPlayersConfig] = useState(["Alice", "Bob", "Carol", "Dave"]);
        const [message, setMessage] = useState("");
        const [adminMode, setAdminMode] = useState(false);
        const [adminCode, setAdminCode] = useState("");
        const [selectedCalendarDay, setSelectedCalendarDay] = useState(null);
        const [newPlayerName, setNewPlayerName] = useState("");
        const [playersDropdownOpen, setPlayersDropdownOpen] = useState(false);
        const [selectedMonth, setSelectedMonth] = useState(new Date().getMonth());
        const [selectedYear, setSelectedYear] = useState(new Date().getFullYear());
        const playersDropdownRef = useRef(null);
        const importInputRef = useRef(null);
        const trendChartRef = useRef(null);
        let trendChartInstance = useRef(null);

        const getSessionsForDate = (dateStr) => {
          return sessions.filter((s) => s.date === dateStr);
        };

        const handleCalendarDayClick = (dateStr, count) => {
          if (count > 0) {
            setSelectedCalendarDay(selectedCalendarDay === dateStr ? null : dateStr);
          }
        };

        const goToPreviousMonth = () => {
          if (selectedMonth === 0) {
            setSelectedMonth(11);
            setSelectedYear(selectedYear - 1);
          } else {
            setSelectedMonth(selectedMonth - 1);
          }
        };

        const goToNextMonth = () => {
          if (selectedMonth === 11) {
            setSelectedMonth(0);
            setSelectedYear(selectedYear + 1);
          } else {
            setSelectedMonth(selectedMonth + 1);
          }
        };

        const [form, setForm] = useState({
          date: "",
          hours: "",
          payer: "",
          players: [],
          note: "",
        });

        useEffect(() => {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return;

          try {
            const data = JSON.parse(raw);
            setTeam(data.team || []);
            setSessions(data.sessions || []);
            setPlayersConfig(data.playersConfig || ["Alice", "Bob", "Carol", "Dave"]);
          } catch {
            setMessage("Could not read saved data.");
          }
        }, []);

        useEffect(() => {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({ team, sessions, playersConfig }));
        }, [team, sessions, playersConfig]);

        useEffect(() => {
          if (!trendChartRef.current || sessions.length === 0) return;

          const ctx = trendChartRef.current.getContext("2d");
          const monthly = getMonthlySpending();
          const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
          const data = months.map((_, idx) => monthly[String(idx + 1).padStart(2, '0')] || 0);

          if (trendChartInstance.current) {
            trendChartInstance.current.destroy();
          }

          trendChartInstance.current = new Chart(ctx, {
            type: 'bar',
            data: {
              labels: months,
              datasets: [{
                label: 'Monthly Spending (₹)',
                data: data,
                backgroundColor: 'rgba(14, 165, 233, 0.85)',
                borderColor: 'rgba(14, 165, 233, 1)',
                borderWidth: 2,
                borderRadius: 10,
                hoverBackgroundColor: 'rgba(2, 132, 199, 0.95)',
                hoverBorderColor: 'rgba(2, 132, 199, 1)',
              }],
            },
            options: {
              responsive: true,
              maintainAspectRatio: true,
              indexAxis: undefined,
              plugins: {
                legend: {
                  display: true,
                  labels: {
                    font: { size: 12, weight: '600' },
                    color: '#111827',
                    usePointStyle: true,
                    padding: 15,
                  },
                },
              },
              scales: {
                y: {
                  beginAtZero: true,
                  title: {
                    display: true,
                    text: 'Amount (₹)',
                    font: { weight: 'bold' },
                  },
                  ticks: {
                    font: { size: 11 },
                    color: '#64748b',
                    callback: function(value) {
                      if (value === 0) return '₹0';
                      if (value >= 1000) return '₹' + (value / 1000).toFixed(1) + 'k';
                      return '₹' + value;
                    },
                  },
                  grid: {
                    color: 'rgba(203, 213, 225, 0.2)',
                    drawBorder: false,
                  },
                },
                x: {
                  ticks: {
                    font: { size: 11, weight: '500' },
                    color: '#64748b',
                  },
                  grid: {
                    display: false,
                  },
                },
              },
            },
          });
        }, [sessions]);

        useEffect(() => {
          const handleClickOutside = (event) => {
            if (playersDropdownRef.current && !playersDropdownRef.current.contains(event.target)) {
              setPlayersDropdownOpen(false);
            }
          };

          document.addEventListener("mousedown", handleClickOutside);
          return () => document.removeEventListener("mousedown", handleClickOutside);
        }, []);

        const balances = useMemo(() => computeBalances(team, sessions), [team, sessions]);
        const settlements = useMemo(() => suggestedSettlements(balances), [balances]);
        const totalCost = useMemo(
          () => sessions.reduce((sum, session) => sum + session.hours * RATE_PER_HOUR, 0),
          [sessions],
        );
        const totalSessions = sessions.length;
        const activePlayers = team.length;
        const averageCost = totalSessions ? totalCost / totalSessions : 0;
        const estimatedCost = Number(form.hours) > 0 ? Number(form.hours) * RATE_PER_HOUR : 0;

        const updateField = (e) => {
          const { name, value } = e.target;
          setForm((prev) => ({ ...prev, [name]: value }));
        };

        const togglePlayerSelection = (player) => {
          setMessage("");
          setForm((prev) => {
            const alreadySelected = prev.players.includes(player);
            if (alreadySelected) {
              return {
                ...prev,
                players: prev.players.filter((value) => value !== player),
              };
            }
            return {
              ...prev,
              players: [...prev.players, player],
            };
          });
        };

        const onAddSession = (e) => {
          e.preventDefault();
          setMessage("");

          try {
            const payer = normalizeName(form.payer);
            const players = form.players.map(normalizeName).filter(Boolean);
            const hours = Number(form.hours);

            if (!form.date) throw new Error("Date is required.");
            if (!(hours > 0)) throw new Error("Hours must be greater than 0.");
            if (players.length < 1) {
              throw new Error("At least one player must be selected.");
            }
            if (!payer) throw new Error("Payer is required.");

            const nextSession = {
              date: form.date,
              hours,
              payer,
              players,
              note: form.note.trim(),
            };

            setSessions((prev) => [...prev, nextSession]);
            setTeam((prev) => {
              const names = new Set(prev);
              [payer, ...players].forEach((name) => names.add(name));
              return [...names];
            });

            setForm({ date: "", hours: "", payer: "", players: [], note: "" });
            setMessage("Session added successfully");
          } catch (err) {
            setMessage(err.message);
          }
        };

        const clearAll = () => {
          if (!window.confirm("Delete all sessions and balances?")) return;
          setTeam([]);
          setSessions([]);
          setMessage("All data cleared.");
        };

        // Dashboard analytics functions
        const getMonthlySpending = () => {
          const monthly = {};
          sessions.forEach((s) => {
            const [year, month] = s.date.split("-");
            const key = `${month}`;
            monthly[key] = (monthly[key] || 0) + s.hours * RATE_PER_HOUR;
          });
          return monthly;
        };

        const getPlayerStats = () => {
          const stats = {};
          team.forEach((player) => {
            stats[player] = { sessions: 0, totalHours: 0, totalSpent: 0 };
          });
          sessions.forEach((s) => {
            stats[s.payer] = stats[s.payer] || { sessions: 0, totalHours: 0, totalSpent: 0 };
            stats[s.payer].sessions += 1;
            stats[s.payer].totalHours += s.hours;
            stats[s.payer].totalSpent += s.hours * RATE_PER_HOUR;
            s.players.forEach((p) => {
              if (stats[p]) {
                stats[p].sessions += 1;
                stats[p].totalHours += s.hours;
              }
            });
          });
          return stats;
        };

        const getCalendarData = () => {
          const calendar = {};
          sessions.forEach((s) => {
            calendar[s.date] = (calendar[s.date] || 0) + 1;
          });
          return calendar;
        };

        const getTrendInsight = () => {
          if (sessions.length < 2) return null;
          const recentAvg = sessions.slice(-5).reduce((sum, s) => sum + s.hours, 0) / Math.min(5, sessions.length);
          const allAvg = sessions.reduce((sum, s) => sum + s.hours, 0) / sessions.length;
          if (recentAvg > allAvg * 1.2) {
            return `📈 Activity increased! Recent average: ${recentAvg.toFixed(1)} hrs/session`;
          } else if (recentAvg < allAvg * 0.8) {
            return `📉 Activity decreased. Recent average: ${recentAvg.toFixed(1)} hrs/session`;
          }
          return `➡️ Steady activity. Average: ${allAvg.toFixed(1)} hrs/session`;
        };

        const unlockAdmin = (e) => {
          e.preventDefault();
          if (adminCode.trim() === "admin123") {
            setAdminMode(true);
            setAdminCode("");
            setMessage("Admin mode enabled");
            return;
          }

          setMessage("Invalid admin code");
        };

        const logoutAdmin = () => {
          setAdminMode(false);
          setAdminCode("");
          setMessage("Admin mode disabled");
        };

        const addPlayer = () => {
          const nextName = normalizeName(newPlayerName);
          if (!nextName) {
            setMessage("Player name cannot be empty.");
            return;
          }
          if (playersConfig.includes(nextName)) {
            setMessage("Player already exists.");
            return;
          }

          setPlayersConfig((prev) => [...prev, nextName]);
          setNewPlayerName("");
          setMessage(`Player ${nextName} added.`);
        };

        const removePlayer = (player) => {
          setPlayersConfig((prev) => prev.filter((name) => name !== player));
          setForm((prev) => ({
            ...prev,
            payer: prev.payer === player ? "" : prev.payer,
            players: prev.players.filter((name) => name !== player),
          }));
          setMessage(`Player ${player} removed.`);
        };

        const exportState = () => {
          const payload = { team, sessions, playersConfig };
          const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = "office-games-sessions.json";
          link.click();
          URL.revokeObjectURL(url);
          setMessage("Export started — file download should begin shortly.");
        };

        const triggerImport = () => {
          importInputRef.current?.click();
        };

        const handleImportFile = (event) => {
          const file = event.target.files?.[0];
          if (!file) return;

          const reader = new FileReader();
          reader.onload = () => {
            try {
              const data = JSON.parse(reader.result);
              if (!data || !Array.isArray(data.sessions) || !Array.isArray(data.playersConfig)) {
                throw new Error("Invalid file format");
              }
              setSessions(data.sessions);
              setPlayersConfig(data.playersConfig);
              const importedTeam = new Set(data.team || []);
              data.sessions.forEach((session) => {
                importedTeam.add(session.payer);
                (session.players || []).forEach((player) => importedTeam.add(player));
              });
              setTeam([...importedTeam]);
              setMessage("Data imported successfully.");
            } catch (err) {
              setMessage(`Import failed: ${err.message}`);
            }
          };
          reader.onerror = () => setMessage("Failed to read the import file.");
          reader.readAsText(file);
          event.target.value = "";
        };

        return (
          <div className="container">
            <div className="hero-card fade-in">
              <div>
                <p className="eyebrow">Game Expense Tracker</p>
                <h1>Office games, settled smarter</h1>
                <p className="hero-copy">
                  Track shared game hours, split costs automatically, and keep team
                  balances crystal clear. Use the admin panel to manage player options
                  and keep the form dynamic.
                </p>
              </div>

              <div className="metrics-grid">
                <article className="metric-card pulse">
                  <span className="metric-label">Total Spend</span>
                  <strong>₹{totalCost.toFixed(2)}</strong>
                  <small>{totalSessions} session{totalSessions !== 1 ? 's' : ''}</small>
                </article>

                <article className="metric-card pulse">
                  <span className="metric-label">Active Players</span>
                  <strong>{activePlayers}</strong>
                  <small>Players involved</small>
                </article>

                <article className="metric-card pulse">
                  <span className="metric-label">Average Session</span>
                  <strong>₹{averageCost.toFixed(2)}</strong>
                  <small>Per session</small>
                </article>

                <article className="metric-card pulse">
                  <span className="metric-label">Rate</span>
                  <strong>₹{RATE_PER_HOUR}/hr</strong>
                  <small>Flat rate</small>
                </article>
              </div>
            </div>

            <section className="card fade-in delay-1">
              <h2><span className="section-icon icon-add"><i className="fas fa-plus"></i></span>Add Session</h2>
              <form onSubmit={onAddSession} className="session-form">
                <div className="grid form-grid">
                  <label>
                    Date
                    <input
                      type="date"
                      name="date"
                      value={form.date}
                      onChange={updateField}
                      required
                    />
                  </label>

                  <label>
                    Hours
                    <input
                      type="number"
                      min="0.5"
                      step="0.5"
                      name="hours"
                      value={form.hours}
                      onChange={updateField}
                      required
                    />
                  </label>

                  <label>
                    Payer
                    <select
                      name="payer"
                      value={form.payer}
                      onChange={updateField}
                      required
                    >
                      <option value="" disabled>
                        Select payer
                      </option>
                      {playersConfig.map((player) => (
                        <option key={player} value={player}>
                          {player}
                        </option>
                      ))}
                    </select>
                  </label>

                  <label className="multi-select-field">
                    Players
                    <div className="multi-select" ref={playersDropdownRef}>
                      <button
                        type="button"
                        className="multi-select-trigger"
                        onClick={() => setPlayersDropdownOpen((open) => !open)}
                      >
                        {form.players.length > 0
                          ? form.players.join(', ')
                          : 'Select players'}
                        <span className="arrow">
                          {playersDropdownOpen ? '▲' : '▼'}
                        </span>
                      </button>
                      {playersDropdownOpen && (
                        <div className="multi-select-list">
                          {playersConfig.map((player) => {
                            const selected = form.players.includes(player);
                            return (
                              <button
                                key={player}
                                type="button"
                                className={`multi-select-item ${selected ? 'selected' : ''}`}
                                onClick={() => togglePlayerSelection(player)}
                              >
                                <span>{player}</span>
                                {selected && <span className="checkmark">✓</span>}
                              </button>
                            );
                          })}
                        </div>
                      )}
                    </div>
                    <small>
                      {form.players.length} selected
                    </small>
                  </label>
                </div>

                <label>
                  Note
                  <textarea
                    rows="2"
                    name="note"
                    value={form.note}
                    onChange={updateField}
                    placeholder="Match details, place, or team note"
                  />
                </label>

                <div className="preview-row">
                  <div className="preview-chip">
                    Estimated total: ₹{estimatedCost.toFixed(2)}
                  </div>
                  <div className="preview-chip secondary">
                    Selected players: {form.players.length}
                  </div>
                </div>

                <div className="actions">
                  <button type="submit">Add Session</button>
                  <button type="button" className="outline" onClick={exportState}>
                    Export Data
                  </button>
                  <button type="button" className="outline" onClick={triggerImport}>
                    Import Data
                  </button>
                  <button type="button" className="danger" onClick={clearAll}>
                    Clear All
                  </button>
                </div>
                <input
                  type="file"
                  ref={importInputRef}
                  accept="application/json"
                  style={{ display: "none" }}
                  onChange={handleImportFile}
                />
              </form>
              {message && <p className="message">{message}</p>}
            </section>

            <section className="card fade-in delay-2">
              <h2><span className="section-icon icon-activity"><i className="fas fa-history"></i></span>Activity</h2>
              <div className="responsive-table">
                <table>
                  <thead>
                    <tr>
                      <th>Date</th>
                      <th>Hours</th>
                      <th>Payer</th>
                      <th>Players</th>
                      <th>Total</th>
                      <th>Note</th>
                    </tr>
                  </thead>
                  <tbody>
                    {[...sessions]
                      .sort((a, b) => a.date.localeCompare(b.date))
                      .map((session, idx) => (
                        <tr key={`${session.date}-${idx}`}>
                          <td>{session.date}</td>
                          <td>{session.hours.toFixed(2)}</td>
                          <td>{session.payer}</td>
                          <td>{session.players.join(', ')}</td>
                          <td>₹{(session.hours * RATE_PER_HOUR).toFixed(2)}</td>
                          <td>{session.note || '—'}</td>
                        </tr>
                      ))}
                  </tbody>
                </table>
              </div>
            </section>

            <section className="card fade-in delay-3">
              <div className="balances-header">
                <h2><span className="section-icon icon-balance"><i className="fas fa-wallet"></i></span>Balances</h2>
                <div className="balance-summary">
                  {settlements.length
                    ? 'Settle up to keep the team aligned.'
                    : 'Everyone is even — great job!'}
                </div>
              </div>

              <div className="responsive-table">
                <table>
                  <thead>
                    <tr>
                      <th>Name</th>
                      <th>Balance</th>
                    </tr>
                  </thead>
                  <tbody>
                    {Object.entries(balances)
                      .sort((a, b) => a[0].localeCompare(b[0]))
                      .map(([name, amount]) => (
                        <tr key={name}>
                          <td>{name}</td>
                          <td className={amount >= 0 ? 'pos' : 'neg'}>
                            {amount >= 0 ? '+' : ''}
                            {amount.toFixed(2)}
                          </td>
                        </tr>
                      ))}
                  </tbody>
                </table>
              </div>
            </section>

            <section className="card fade-in delay-4">
              <h2><span className="section-icon icon-settlement"><i className="fas fa-handshake"></i></span>Suggested Settlements</h2>
              <ul className="settlement-list">
                {settlements.length ? (
                  settlements.map((settlement, index) => {
                    // Parse settlement text: "A pays B: ₹100"
                    const match = settlement.match(/(.+?)\s+pays\s+(.+?):\s+₹([\d.]+)/);
                    if (match) {
                      const [, from, to, amount] = match;
                      return (
                        <li key={index}>
                          <div className="settlement-item">
                            <span className="settlement-from">
                              <i className="fas fa-user"></i>
                              {from}
                            </span>
                            <span className="settlement-arrow">
                              <i className="fas fa-arrow-right"></i>
                            </span>
                            <span className="settlement-to">
                              <i className="fas fa-user"></i>
                              {to}
                            </span>
                          </div>
                          <span className="settlement-amount">₹{parseFloat(amount).toFixed(2)}</span>
                        </li>
                      );
                    }
                    return <li key={index}>{settlement}</li>;
                  })
                ) : (
                  <li style={{ background: 'linear-gradient(135deg, rgba(34, 197, 94, 0.08) 0%, rgba(34, 197, 94, 0.05) 100%)', border: '1px solid rgba(34, 197, 94, 0.2)' }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                      <i className="fas fa-check-circle" style={{ color: '#22c55e' }}></i>
                      <span style={{ color: '#166534', fontWeight: '600' }}>All settled up! No payments needed.</span>
                    </div>
                  </li>
                )}
              </ul>
            </section>

            <section className="dashboard-section fade-in delay-5">
              <h2><span className="section-icon icon-trends"><i className="fas fa-chart-bar"></i></span>Spending Trends</h2>
              {sessions.length > 0 ? (
                <div>
                  <div className="trend-insight">{getTrendInsight()}</div>
                  <div className="trend-chart">
                    <canvas ref={trendChartRef} id="trendChart"></canvas>
                  </div>
                </div>
              ) : (
                <p className="empty-state">No data yet. Add sessions to see trends.</p>
              )}
            </section>

            <section className="dashboard-section fade-in delay-5">
              <h2><span className="section-icon icon-players"><i className="fas fa-users"></i></span>Active Players</h2>
              {team.length > 0 ? (
                <div className="player-stats-grid">
                  {(() => {
                    const stats = getPlayerStats();
                    return Object.entries(stats)
                      .sort((a, b) => b[1].sessions - a[1].sessions)
                      .map(([player, data]) => (
                        <div key={player} className="player-stat-card">
                          <div className="player-stat-name">{player}</div>
                          <div className="player-stat-info">
                            <span>
                              <span className="stat-badge">{data.sessions} sessions</span>
                            </span>
                            <span>
                              <span className="stat-badge">{data.totalHours.toFixed(1)} hrs</span>
                            </span>
                          </div>
                          <div className="player-stat-info">
                            <strong>₹{data.totalSpent.toFixed(0)}</strong>
                            <span style={{ color: '#64748b' }}>total involvement</span>
                          </div>
                        </div>
                      ));
                  })()}
                </div>
              ) : (
                <p className="empty-state">No active players. Add sessions to see player stats.</p>
              )}
            </section>

            <section className="dashboard-section fade-in delay-5">
              <h2><span className="section-icon icon-calendar"><i className="fas fa-calendar-alt"></i></span>Session Calendar</h2>
              {sessions.length > 0 ? (
                <div>
                  <div className="calendar-nav">
                    <button type="button" onClick={goToPreviousMonth}>← Previous</button>
                    <div className="calendar-month-year">
                      {new Date(selectedYear, selectedMonth).toLocaleDateString('en-US', { month: 'long', year: 'numeric' })}
                    </div>
                    <button type="button" onClick={goToNextMonth}>Next →</button>
                  </div>
                  <div className="calendar-header">
                    {['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map((day) => (
                      <div key={day} className="calendar-header-day">
                        {day}
                      </div>
                    ))}
                  </div>
                  <div className="calendar-grid">
                    {(() => {
                      const year = selectedYear;
                      const month = selectedMonth;
                      const firstDay = new Date(year, month, 1);
                      const lastDay = new Date(year, month + 1, 0);
                      const daysInMonth = lastDay.getDate();
                      const startingDayOfWeek = firstDay.getDay();
                      const calendarData = getCalendarData();
                      const days = [];

                      for (let i = 0; i < startingDayOfWeek; i++) {
                        days.push(null);
                      }
                      for (let i = 1; i <= daysInMonth; i++) {
                        days.push(i);
                      }

                      return days.map((day, idx) => {
                        if (!day) {
                          return <div key={`empty-${idx}`} className="calendar-day" style={{ visibility: 'hidden' }} />;
                        }
                        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                        const count = calendarData[dateStr] || 0;
                        const daySessionsForDate = getSessionsForDate(dateStr);
                        const showTooltip = selectedCalendarDay === dateStr && count > 0;
                        return (
                          <div
                            key={day}
                            className={`calendar-day ${count > 0 ? 'has-session' : ''}`}
                            onClick={() => handleCalendarDayClick(dateStr, count)}
                            style={{ cursor: count > 0 ? 'pointer' : 'default' }}
                          >
                            <div className="calendar-day-number">{day}</div>
                            {count > 0 && <div className="calendar-day-count">{count}📍</div>}
                            {showTooltip && (
                              <div className="calendar-day-tooltip">
                                {daySessionsForDate.map((sess, sIdx) => (
                                  <div key={sIdx} className="tooltip-session">
                                    <div className="tooltip-payer"><i className="fas fa-user-circle"></i> {sess.payer}</div>
                                    <div className="tooltip-players">Players: {sess.players.join(', ')}</div>
                                    <div className="tooltip-cost">₹{(sess.hours * RATE_PER_HOUR).toFixed(0)} ({sess.hours}h)</div>
                                  </div>
                                ))}
                              </div>
                            )}
                          </div>
                        );
                      });
                    })()}
                  </div>
                  <small style={{ color: '#64748b', marginTop: '12px', display: 'block' }}>
                    Current month view • Highlighted dates have sessions
                  </small>
                </div>
              ) : (
                <p className="empty-state">No sessions yet. Add a session to populate the calendar.</p>
              )}
            </section>

            <section className="card admin-panel fade-in delay-5">
              <div className="admin-header">
                <div>
                  <h2>Admin Player Configuration</h2>
                  <p>
                    Manage the dropdown values used in the form. Available only to
                    admin.
                  </p>
                </div>

                {adminMode ? (
                  <button type="button" className="outline" onClick={logoutAdmin}>
                    Logout Admin
                  </button>
                ) : null}
              </div>

              {!adminMode ? (
                <form className="admin-form" onSubmit={unlockAdmin}>
                  <label>
                    Admin code
                    <input
                      type="password"
                      name="adminCode"
                      value={adminCode}
                      onChange={(e) => setAdminCode(e.target.value)}
                      placeholder="Enter admin code"
                    />
                  </label>
                  <button type="submit" className="outline">
                    Unlock Admin
                  </button>
                </form>
              ) : (
                <div className="admin-controls">
                  <div className="admin-row">
                    <label>
                      New player name
                      <input
                        type="text"
                        value={newPlayerName}
                        onChange={(e) => setNewPlayerName(e.target.value)}
                        placeholder="e.g. Daniel"
                      />
                    </label>
                    <button type="button" onClick={addPlayer}>
                      Add Player
                    </button>
                  </div>

                  <div className="player-list">
                    {playersConfig.length ? (
                      playersConfig.map((player) => (
                        <button
                          key={player}
                          type="button"
                          className="player-chip"
                          onClick={() => removePlayer(player)}
                        >
                          {player} <span>remove</span>
                        </button>
                      ))
                    ) : (
                      <div className="empty-state">No configured players yet.</div>
                    )}
                  </div>
                </div>
              )}
            </section>
          </div>
        );
      }

      createRoot(document.getElementById("root")).render(
        <React.StrictMode>
          <App />
        </React.StrictMode>,
      );
    </script>
  </body>
</html>
